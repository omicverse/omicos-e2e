[project]
name = "omicos-env"
version = "0.1.0"
description = "Bundled sandbox Python for the omicos shared kernel."
readme = "README.md"
requires-python = "==3.11.*"
license = "GPL-3.0-or-later"
authors = [{ name = "omicos" }]

# ─── Top-level deps ────────────────────────────────────────────────────────
# Keep this list small and curated. Transitive deps (numpy, scipy, torch, jax,
# polars, etc.) come along automatically and are pinned by uv.lock. Do not
# add anything here that the *shared kernel* doesn't need at import time —
# the shell tool runs against the host environment, not this venv.
dependencies = [
  # Core scientific stack
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",

  # Single-cell / omics
  "scanpy",
  "anndata",
  "omicverse>=2.2",

  # Notebook surface (omicos persists notebooks via nbformat; ipykernel
  # lets the user attach a Jupyter front-end to this env if they want one).
  "ipykernel",
  "nbformat",

  # Plot endpoints the SPA's AnnDataViewer hits.
  "plotly",

  # NOTE: torch is intentionally NOT a base dependency. It is the single
  # biggest cross-platform install hazard (PyPI ships no macOS-arm64 wheel
  # on the CUDA index, and there are no torch wheels at all for some arm
  # targets), and omicverse imports fine without it — the shared kernel
  # starts and the analysis agents run without torch (the GPU/torch
  # codepaths have CPU fallbacks). GPU users opt in via the `gpu` extra
  # below (`uv sync --extra gpu`), which pulls torch from the CUDA index.

  # NCBI E-utilities client (Entrez.esearch / esummary / efetch / elink)
  # — backbone of the GEO-everything agent's search + DOI-linkout flows.
  "biopython",

  # Rust-backed out-of-memory AnnData reader. Powers
  # `ov.read(path, backend='rust')` for `.h5ad` files too big to fit
  # into RAM (single-cell cohorts > ~500k cells, ~5 GB on disk). Without
  # this dep the rust backend raises ImportError and the user has to
  # pip-install at run time, which the single_cell_preprocessor agent
  # routinely needs out of the box.
  # Scoped off Windows: no win wheel, and its sdist build fails (maturin
  # → cmake → HDF5 static-lib build panics). omicverse imports fine
  # without it; only the rust OOM backend is unavailable on Windows.
  "anndataoom; sys_platform != 'win32'",

  # Office-document IO — backs the `office-tools` skill in omicos-admin
  # so the writer / analyst agents can produce .docx manuscripts,
  # .xlsx supplementary tables, .pptx defense decks, and .pdf figure
  # sheets out of the box (without pip-installing at run time, which
  # the sandboxed kernel doesn't allow without an interrupt).
  # All MIT/BSD, pure-Python wheels — no system-lib surprises.
  "python-docx",   # MIT  — Word read/write/edit
  "openpyxl",      # MIT  — Excel read/write with formulas + formatting
  "xlsxwriter",    # MIT  — Excel write with charts + conditional fmt
  "python-pptx",   # MIT  — PowerPoint read/write/edit
  "pypdf",         # BSD  — PDF read, merge, split, form-fill
  "pdfplumber",    # MIT  — PDF text + table extraction with layout
  "reportlab",     # BSD  — PDF generation from scratch

  # Phylogenetics / phylogenomics — PhyKIT
  # (https://github.com/JLSteenwyk/PhyKIT). Backs the
  # `phylogenomics_analyst` agent's skill family for alignment quality
  # metrics, tree quality metrics, gene-gene covariation (mirror tree),
  # polytomy testing (rapid radiation), and MSA accuracy scoring.
  # Pure-Python (BioPython-based), MIT-licensed, no system libs.
  "phykit",
]

# Opt-in GPU stack. `uv sync --extra gpu` adds torch from the CUDA wheel
# index (see [tool.uv.sources] + [[tool.uv.index]] below). Kept out of the
# base env so a plain `uv sync` installs cleanly on every platform.
[project.optional-dependencies]
gpu = [
  "torch",
]

[tool.uv]
# Project mode — uv manages the venv from this pyproject.toml + uv.lock.
managed = true

# Cap transitive deps to versions whose cp311 Linux wheels target
# manylinux_2_17 (or older / abi3-cp37). Required for glibc 2.17 hosts
# (e.g. Sherlock CentOS 7 compute). Without these caps, uv resolves to
# the very latest releases that only ship manylinux_2_28 wheels and the
# install fails over and over against missing system libs.
constraint-dependencies = [
  "numpy<2.3",
  "scipy<1.17",
  "pandas<2.4",
  "scikit-learn<1.8",
  "scikit-image<0.26",
  "scikit-misc<0.6",
  "pyarrow<21",
  "h5py<3.15",
  "pyzmq<27",
  "matplotlib<3.11",
  "contourpy<1.4",
  # llvmlite 0.46+ dropped macosx_x86_64 (Intel-mac) wheels, so on Intel
  # macs uv falls back to an sdist LLVM build that fails. 0.45.1 is the
  # last with an Intel-mac cp311 wheel; pin numba to its 0.62 partner.
  "numba<0.63",
  "llvmlite<0.46",
  "pillow<13",
  "statsmodels<0.15",
  "numcodecs<0.17",
  "pydantic-core<2.47",
  "libcst<1.8",
  "kiwisolver<1.6",
  "fonttools<4.63",
  "torch<2.7",
  "tokenizers<0.24",
  "igraph<0.12",
]

# torch comes from PyTorch's CUDA wheel index, not PyPI. `explicit = true`
# means only packages that opt in via [tool.uv.sources] use this index, so
# we don't accidentally pull anything else through it.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
