name: omicos-e2e

# Post-publish end-to-end test for the @omicverse/omicos npm package.
# This repo contains NO omicos-core source — it only proves that, on each
# of the 6 shipping platforms, a user can:
#   1. install the published npm package  (`npm i -g @omicverse/omicos`)
#   2. build the bundled kernel env        (`uv sync` of env/)
#   3. import the scientific stack         (omicverse / scanpy / anndata)
#   4. start omicos and have it spawn the kernel from that env
#
# Native runner per target arch — a binary must RUN on its own arch, so
# every platform gets its own real runner (free on public repos).
on:
  workflow_dispatch:
    inputs:
      omicos_version:
        description: "npm version of @omicverse/omicos to test (default: latest)"
        required: false
        default: "latest"
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  # Let omicos-core's publish workflow kick this off after a release:
  #   gh api repos/omicverse/omicos-e2e/dispatches -f event_type=npm-published
  repository_dispatch:
    types: [npm-published]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: darwin-arm64, os: macos-latest }
          - { name: darwin-x64, os: macos-15-intel }
          - { name: win-x64, os: windows-latest }
          - { name: win-arm64, os: windows-11-arm }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 1. Install the published package — npm resolves the matching
      #    @omicverse/omicos-<os>-<cpu> platform package via os/cpu.
      - name: Install @omicverse/omicos from npm
        shell: bash
        run: |
          ver="${{ github.event.inputs.omicos_version || 'latest' }}"
          npm i -g "@omicverse/omicos@${ver}"

      # 2. The native binary executes on this arch.
      - name: omicos binary runs
        shell: bash
        run: omicos --help

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      # 3. Build the bundled kernel env from the SAME recipe omicos ships.
      #    This is the per-platform "env config is OK" gate — it catches
      #    any dependency that lacks a wheel for this os/arch.
      - name: Build kernel env (uv sync, base / no GPU)
        working-directory: env
        shell: bash
        run: uv sync --no-progress

      # 4. The kernel env imports the scientific stack (no torch needed).
      - name: Kernel env imports omicverse / scanpy / anndata
        working-directory: env
        shell: bash
        run: |
          uv run python - <<'PY'
          import omicverse as ov, scanpy as sc, anndata
          print("omicverse", ov.__version__)
          print("scanpy", sc.__version__)
          try:
              import anndataoom  # noqa: F401
              print("anndataoom OK (rust OOM backend available)")
          except ImportError:
              print("anndataoom not installed (expected on Windows)")
          print("imports OK")
          PY

      # 5. omicos starts and spawns the shared kernel from our env.
      #    Best-effort (the serve contract may evolve) — does not fail the
      #    job, but surfaces a warning if the kernel-spawn log is missing.
      - name: omicos serve spawns the kernel from the env
        working-directory: env
        shell: bash
        continue-on-error: true
        run: |
          set -x
          if [ -x ".venv/bin/python" ]; then PY="$PWD/.venv/bin/python";
          else PY="$PWD/.venv/Scripts/python.exe"; fi
          export OMICOS_KERNEL_PYTHON="$PY"
          export OMICOS_ENV_DIR="$PWD"
          omicos serve --host 127.0.0.1 --port 8917 > serve.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 45); do
            if grep -Eqi "spawn.*kernel|shared Python kernel|kernel.*ready|listening" serve.log 2>/dev/null; then ok=1; break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 2
          done
          echo "----- serve.log (tail) -----"; tail -n 40 serve.log || true
          kill "$pid" 2>/dev/null || true
          if [ "$ok" = "1" ]; then echo "omicos serve started + kernel spawned"; else echo "::warning::omicos serve did not log a kernel-spawn/listening line"; fi

  summary:
    name: e2e summary
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on hard checks
        run: |
          # The e2e job's matrix uses fail-fast:false; this gate fails the
          # run if ANY platform failed its hard steps (install/sync/import).
          if [ "${{ contains(needs.e2e.result, 'failure') }}" = "true" ]; then
            echo "::error::one or more platforms failed the omicos e2e"; exit 1
          fi
          echo "all platforms passed the hard e2e checks"
