name: omicos-e2e

# Post-publish end-to-end test for the @omicverse/omicos npm package.
# This repo contains NO omicos-core source — it only proves that, on each
# of the 6 shipping platforms, a user can:
#   1. install the published npm package  (`npm i -g @omicverse/omicos`)
#   2. build the bundled kernel env        (`uv sync` of env/)
#   3. import the scientific stack         (omicverse / scanpy / anndata)
#   4. start omicos and have it spawn the kernel from that env
#
# Native runner per target arch — a binary must RUN on its own arch, so
# every platform gets its own real runner (free on public repos).
on:
  workflow_dispatch:
    inputs:
      omicos_version:
        description: "npm version of @omicverse/omicos to test (default: latest)"
        required: false
        default: "latest"
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  # Let omicos-core's publish workflow kick this off after a release:
  #   gh api repos/omicverse/omicos-e2e/dispatches -f event_type=npm-published
  repository_dispatch:
    types: [npm-published]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: darwin-arm64, os: macos-latest }
          - { name: darwin-x64, os: macos-15-intel }
          - { name: win-x64, os: windows-latest }
          - { name: win-arm64, os: windows-11-arm }
    steps:
      # No checkout / no vendored recipe needed — the env recipe is baked
      # into the omicos binary; the test only consumes the published npm
      # package.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 1. Install the published package — npm resolves the matching
      #    @omicverse/omicos-<os>-<cpu> platform package via os/cpu.
      - name: Install @omicverse/omicos from npm
        shell: bash
        run: |
          ver="${{ github.event.inputs.omicos_version || 'latest' }}"
          npm i -g "@omicverse/omicos@${ver}"

      # 2. The native binary executes on this arch.
      - name: omicos binary runs
        shell: bash
        run: omicos --help

      # 3. ONE-CLICK env setup — the real first-run bootstrap baked into
      #    the binary: auto-installs uv if needed, then syncs the embedded
      #    recipe into ~/.omicos/env. This is exactly what a user hits on
      #    first run, AND the per-platform "env config is OK" gate (it
      #    catches any dep without a wheel for this os/arch).
      - name: One-click env setup (omicos env setup --yes)
        shell: bash
        run: omicos env setup --yes

      # 4. The bootstrapped env is functional — omicverse importable.
      - name: Env doctor — omicverse present
        shell: bash
        run: |
          omicos env doctor
          omicos env doctor 2>&1 | grep -i omicverse | grep -qi present \
            || { echo "::error::omicverse missing after env setup"; exit 1; }

      # 5. omicos starts and spawns the shared kernel from the env that
      #    `env setup` just provisioned (resolved via .kernel_choice).
      #    Best-effort.
      - name: omicos serve spawns the kernel
        shell: bash
        continue-on-error: true
        run: |
          omicos serve --host 127.0.0.1 --port 8917 > serve.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 45); do
            if grep -Eqi "spawn.*kernel|shared Python kernel|kernel.*ready|listening" serve.log 2>/dev/null; then ok=1; break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 2
          done
          echo "----- serve.log (tail) -----"; tail -n 40 serve.log || true
          kill "$pid" 2>/dev/null || true
          if [ "$ok" = "1" ]; then echo "omicos serve started + kernel spawned"; else echo "::warning::serve did not log a kernel-spawn/listening line"; fi

  summary:
    name: e2e summary
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on hard checks
        run: |
          # The e2e job's matrix uses fail-fast:false; this gate fails the
          # run if ANY platform failed its hard steps (install/sync/import).
          if [ "${{ contains(needs.e2e.result, 'failure') }}" = "true" ]; then
            echo "::error::one or more platforms failed the omicos e2e"; exit 1
          fi
          echo "all platforms passed the hard e2e checks"
